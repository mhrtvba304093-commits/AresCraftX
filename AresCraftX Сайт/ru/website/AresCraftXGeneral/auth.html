<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AresCraftX - Авторизация</title>
    <link rel="stylesheet" href="../../style/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Огненный статичный логотип -->
            <div class="logo-section">
                <div class="fire-logo">
                    <div class="flame-icon">
                        <i class="fas fa-fire"></i>
                        <div class="flame-glow"></div>
                    </div>
                    <div class="logo-text">
                        <span class="logo-ares">Ares</span>
                        <span class="logo-craft">Craft<span class="logo-x">X</span></span>
                    </div>
                </div>
                <div class="fire-underline"></div>
            </div>

            <!-- Переключение между Входом и Регистрацией -->
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>

            <!-- ФОРМА ВХОДА -->
            <div id="login-form" class="auth-form active">
                <div class="social-login">
                    <button class="social-btn google" id="googleLogin">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn discord" id="discordLogin">
                        <i class="fab fa-discord"></i> Discord
                    </button>
                    <button class="social-btn github" id="githubLogin">
                        <i class="fab fa-github"></i> GitHub
                    </button>
                    <!-- Вместо обычной кнопки, используем виджет -->
                    <div class="social-btn telegram" id="telegramLoginContainer">
                        <i class="fab fa-telegram"></i>
                        <span>Telegram</span>
                        <div id="telegram-widget-container" style="display: none;"></div>
                    </div>
                </div>

                <div class="divider">
                    <span>или</span>
                </div>

                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="Имя пользователя / Email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Пароль">
                    <i class="fas fa-eye-slash toggle-password"></i>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe"> Запомнить меня
                    </label>
                    <a href="#" id="forgotPasswordLink" class="forgot-link">Забыли пароль?</a>
                </div>

                <button class="submit-btn" id="loginSubmit">Войти</button>

                <div class="terms-link">
                    <a href="#" id="termsLink">Пользовательское соглашение</a>
                </div>
            </div>

            <!-- ФОРМА РЕГИСТРАЦИИ -->
            <div id="register-form" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regUsername" placeholder="Имя пользователя" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="regPhone" placeholder="Номер телефона">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Пароль" required>
                    <i class="fas fa-eye-slash toggle-password"></i>
                </div>

                <div class="input-group">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="regConfirmPassword" placeholder="Подтверждение пароля" required>
                </div>

                <!-- Выбор способа верификации -->
                <div class="verification-options">
                    <label class="radio-label">
                        <i class="fas fa-envelope"></i>
                        <input type="radio" name="verifyMethod" value="email" checked>
                        <span>Email код</span>
                    </label>
                    <label class="radio-label">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="radio" name="verifyMethod" value="sms">
                        <span>SMS код</span>
                    </label>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="acceptTerms"> Я принимаю <a href="#" class="terms-inline">пользовательское соглашение</a>
                    </label>
                </div>

                <button class="submit-btn" id="registerSubmit">Зарегистрироваться</button>
            </div>

            <!-- ВОССТАНОВЛЕНИЕ ПАРОЛЯ -->
            <div id="forgot-panel" class="forgot-panel">
                <h3>Восстановление доступа</h3>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="forgotUsername" placeholder="Имя пользователя или Email">
                </div>
                <button class="submit-btn" id="sendResetLink">Отправить код</button>
                <button class="back-btn" id="backToLogin">Назад ко входу</button>
            </div>

            <!-- 2FA МОДАЛЬНОЕ ОКНО -->
            <div id="twofaModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <i class="fas fa-shield-alt"></i>
                        <h3>Двухфакторная аутентификация</h3>
                    </div>
                    <p>Введите код из Google Authenticator</p>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="text" id="twofaCode" placeholder="Код 2FA" maxlength="6">
                    </div>
                    <div class="modal-buttons">
                        <button class="submit-btn" id="verifyTwofa">Подтвердить</button>
                        <button class="cancel-btn" id="cancelTwofa">Отмена</button>
                    </div>
                </div>
            </div>

            <!-- МОДАЛЬНОЕ ОКНО КОДА ПОДТВЕРЖДЕНИЯ -->
            <div id="verificationModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <i class="fas fa-envelope"></i>
                        <h3>Подтверждение</h3>
                    </div>
                    <p id="verificationMessage">Код отправлен на ваш email</p>
                    <div class="input-group">
                        <i class="fas fa-code"></i>
                        <input type="text" id="verificationCode" placeholder="Введите код" maxlength="6">
                    </div>
                    <div class="modal-buttons">
                        <button class="submit-btn" id="verifyCodeBtn">Подтвердить</button>
                        <button class="cancel-btn" id="cancelVerifyBtn">Отмена</button>
                    </div>
                    <button class="resend-btn" id="resendCode">Отправить код повторно</button>
                </div>
            </div>

            <!-- МОДАЛЬНОЕ ОКНО СБРОСА ПАРОЛЯ -->
            <div id="resetPasswordModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <i class="fas fa-key"></i>
                        <h3>Сброс пароля</h3>
                    </div>
                    <p>Введите код из письма и новый пароль</p>
                    <div class="input-group">
                        <i class="fas fa-code"></i>
                        <input type="text" id="resetCode" placeholder="Код подтверждения" maxlength="6">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="Новый пароль">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-check-circle"></i>
                        <input type="password" id="confirmNewPassword" placeholder="Подтвердите пароль">
                    </div>
                    <div class="modal-buttons">
                        <button class="submit-btn" id="confirmResetBtn">Сбросить пароль</button>
                        <button class="cancel-btn" id="cancelResetBtn">Отмена</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../scripts/auth.js"></script>
</body>
</html>
